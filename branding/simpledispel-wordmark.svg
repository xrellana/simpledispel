<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">SimpleDispel horizontal wordmark</title>
  <desc id="desc">The SimpleDispel emblem beside the project name and the phrase click, cleanse, continue.</desc>
  <defs>
    <linearGradient id="panel" x1="80" y1="24" x2="1514" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102C3A"/>
      <stop offset="1" stop-color="#07131C"/>
    </linearGradient>
    <linearGradient id="mint" x1="86" y1="70" x2="422" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92FFD4"/>
      <stop offset="0.52" stop-color="#4EE6A8"/>
      <stop offset="1" stop-color="#25B987"/>
    </linearGradient>
    <linearGradient id="aura" x1="170" y1="160" x2="324" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B16EFF"/>
      <stop offset="1" stop-color="#4E318F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02070B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="#07131C"/>
  <rect x="16" y="16" width="1568" height="448" rx="112" fill="url(#panel)"/>
  <rect x="24" y="24" width="1552" height="432" rx="104" fill="none" stroke="#BFFFF0" stroke-opacity="0.14" stroke-width="4"/>

  <g filter="url(#shadow)">
    <path d="M252 66C300 90 350 104 402 114V258C402 358 342 422 252 458C162 422 102 358 102 258V114C154 104 204 90 252 66Z" fill="#0E3038" stroke="url(#mint)" stroke-width="16" stroke-linejoin="round" transform="translate(0 -22) scale(0.96) translate(10 10)"/>
    <rect x="174" y="147" width="154" height="154" rx="34" fill="url(#aura)" stroke="#D7C6FF" stroke-width="6"/>
    <path d="M233 145C240 176 255 191 286 198C255 205 240 220 233 251C226 220 211 205 180 198C211 191 226 176 233 145Z" fill="#4EE6A8"/>
    <path d="M273 219V345L307 314L341 388L375 372L341 300L383 296L273 219Z" fill="#F5FFFB" stroke="#07141D" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="480" y="163" fill="#92A8B4" font-size="66" font-weight="650" letter-spacing="14">SIMPLE</text>
    <text x="468" y="340" fill="#F2FFF9" font-size="176" font-weight="800" letter-spacing="2">DISPEL</text>
    <rect x="1118" y="104" width="350" height="72" rx="36" fill="#4EE6A8" fill-opacity="0.1" stroke="#4EE6A8" stroke-opacity="0.34" stroke-width="3"/>
    <text x="1293" y="151" fill="#83F7C8" font-size="28" font-weight="700" letter-spacing="4" text-anchor="middle">WOW ADDON</text>
    <text x="480" y="406" fill="#91A5B0" font-size="29" font-weight="600" letter-spacing="5">CLICK · CLEANSE · CONTINUE</text>
  </g>
</svg>
